version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.18

commands:
  install:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  verify:
    executor: node
    steps:
      - install
      - run:
          name: Type check
          command: npm run typecheck
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm run test:ci

  deploy:
    executor: node
    steps:
      - install
      - run: git config user.email "badrri1995@gmail.com"
      - run: git config user.name "ci-build-bot"
      - add_ssh_keys:
          fingerprints:
            - "SHA256:MafrUoQ+zcahmhI/OV1/UkInCAOfE2xpPGi7M/iQYBs"
      - run:
          name: Deploy to GitHub Pages
          command: npm run deploy

workflows:
  build_app:
    jobs:
      - verify:
          filters:
            branches:
              ignore:
                - gh-pages
      - deploy:
          requires:
            - verify
          filters:
            branches:
              only:
                - master
